<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AutoForm Fill</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img src="icons/icon48.png" class="logo" alt="AutoForm Fill logo" />
      <div>
        <h1>AutoForm Fill</h1>
        <span class="sub">QA test-data toolkit</span>
      </div>
    </div>
    <button id="settingsBtn" class="icon-btn" title="Settings">⚙</button>
  </header>

  <div id="pageError" class="notice hidden">
    AutoForm Fill can’t run on this page.<br><span>Try a normal http(s):// page.</span>
  </div>

  <div id="main" class="hidden">
    <label class="lbl" for="profileSelect">Profile</label>
    <select id="profileSelect"></select>

    <label class="lbl">Data mode</label>
    <div id="modeChips" class="chips"></div>

    <button id="fillBtn" class="primary">Fill form</button>

    <div class="row">
      <button id="clearBtn" class="secondary">Clear</button>
      <button id="pickBtn" class="secondary">Select fields</button>
    </div>

    <div class="row toggles">
      <label class="switch-label" for="seqToggle">
        Unique sequence
        <span class="hint" id="seqHint">off</span>
      </label>
      <div id="seqToggle" class="switch" role="switch" aria-checked="false" tabindex="0"></div>
    </div>

    <section id="report" class="report hidden">
      <div class="report-head">
        <b>Last fill</b>
        <span id="reportMeta"></span>
      </div>
      <div id="reportCounts" class="counts"></div>
      <div id="reportFields" class="fields"></div>
    </section>

    <footer>
      <div class="foot-row">
        <span class="ver">v<span id="version"></span> · data stays local</span>
        <a id="optionsLink" href="#">Options</a>
      </div>
      <hr class="foot-sep" />
      <p class="credit">This project is developed by <a href="https://inside.ansnew.com/" target="_blank" rel="noopener">ANSNEW TECH.</a></p>
    </footer>
  </div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
